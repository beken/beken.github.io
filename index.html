<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Beyza Eken — Personal Website</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><text x='50' y='58' font-size='52' text-anchor='middle' fill='%23fff'>BE</text></svg>">

<style>
:root{
--bg:#0b0c0f;
--card:#111319;
--text:#eaeef7;
--muted:#a5b1c8;
--brand:#6ea8fe;
--accent:#9b8cff;
}
@media (prefers-color-scheme: light){
:root{--bg:#f7f8fb;--card:#fff;--text:#0d1223;--muted:#4a5771;}
}
body{margin:0;font:16px system-ui;background:var(--bg);color:var(--text)}
.container{max-width:1080px;margin:auto;padding:24px}
.card{background:var(--card);border-radius:16px;padding:24px}
.section{margin:34px 0}
h1{font-size:40px;margin:0 0 10px}
h2{font-size:22px}
a{color:var(--brand);text-decoration:none}

/* calendar */
#calendar{margin-top:10px}
.fc .fc-toolbar-title{font-size:18px}
.fc a{color:inherit;text-decoration:none}

/* popup */
.my-popup{
position:fixed;
right:20px;
bottom:20px;
background:var(--card);
color:var(--text);
padding:12px 14px;
border-radius:14px;
box-shadow:0 10px 40px rgba(0,0,0,.3);
width:min(420px,calc(100vw - 40px));
display:none;
z-index:9999;
}
.my-popup .close{float:right;cursor:pointer;color:var(--muted);}
.my-popup .meta{font-size:13px;color:var(--muted);}
</style>

<!-- FullCalendar -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/index.global.min.css">
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/daygrid@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/interaction@6.1.15/index.global.min.js"></script>

<!-- ICS parser -->
<script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>

</head>

<body>

<main class="container">

<section class="section">
<div class="card">
<h1>Hi, I'm Beyza</h1>
<p>
Assistant Professor in Software Engineering.  
Research: Empirical Software Engineering, NLP, LLMs.
</p>
</div>
</section>

<section class="section" id="office-hours">
<h2>Office Hours</h2>
<div class="card">
<div id="calendar"></div>
</div>
</section>

</main>

<!-- popup -->
<div id="popup" class="my-popup">
<span class="close" id="popupClose">✕</span>
<h3 id="pTitle"></h3>
<div class="meta" id="pMeta"></div>
</div>

<script>
/* =========================
   CONFIG
========================= */

// Google Calendar → Public iCal link
const ICS_URL = "https://calendar.google.com/calendar/ical/beken%40sakarya.edu.tr/public/basic.ics";

/* =========================
   Popup
========================= */

function showPopup(title, html){
document.getElementById("pTitle").textContent = title;
document.getElementById("pMeta").innerHTML = html;
document.getElementById("popup").style.display="block";
}
document.getElementById("popupClose").onclick=()=>{
document.getElementById("popup").style.display="none";
};

/* =========================
   ICS → Events
========================= */

async function fetchEvents(){
const res = await fetch(ICS_URL,{cache:"no-store"});
const txt = await res.text();

const jcal = ICAL.parse(txt);
const comp = new ICAL.Component(jcal);
const events = comp.getAllSubcomponents("vevent");

return events.map(v=>{
const e = new ICAL.Event(v);
return {
title:e.summary || "",
start:e.startDate?.toJSDate(),
end:e.endDate?.toJSDate(),
extendedProps:{
location:e.location || ""
}
};
}).filter(e=>e.start);
}

/* =========================
   Calendar Init
========================= */

document.addEventListener("DOMContentLoaded", async ()=>{

const calendar = new FullCalendar.Calendar(
document.getElementById("calendar"),
{
plugins:[FullCalendar.DayGrid,FullCalendar.Interaction],
initialView:"dayGridMonth",
firstDay:1,
height:"auto",
headerToolbar:{
left:"prev,next today",
center:"title",
right:"dayGridMonth,dayGridWeek"
},
eventClick:function(info){

// EMAIL GÖSTERİLMİYOR
const ev = info.event;

const start = ev.start ? ev.start.toLocaleString() : "";
const end = ev.end ? ev.end.toLocaleString() : "";
const loc = ev.extendedProps.location ?
`<br><b>Location:</b> ${ev.extendedProps.location}` : "";

showPopup(
ev.title,
`<b>Start:</b> ${start}${end ? `<br><b>End:</b> ${end}` : ""}${loc}`
);

info.jsEvent.preventDefault();
}
}
);

calendar.render();

try{
calendar.addEventSource(await fetchEvents());
}catch(e){
console.error(e);
alert("Calendar load error (ICS link or CORS).");
}

});
</script>

</body>
</html>
