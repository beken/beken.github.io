name: Update calendar.ics

on:
  schedule:
    - cron: "0 3 * * *"   # daily 03:00 UTC (06:00 TR)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ICS
        run: |
          curl -L "https://calendar.google.com/calendar/ical/beken%40sakarya.edu.tr/public/basic.ics" -o calendar.ics

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar.ics
          git diff --staged --quiet || git commit -m "Update calendar.ics"
          git push
